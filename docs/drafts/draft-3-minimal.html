<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کیانا و علی | جشن نامزدی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f5f2;
    --ink:#191817;
    --mute:#8b857c;
    --hair:#dcd7d0;
    --wine:#8c2f39;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--paper);color:var(--ink);
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }

  /* ---------- صحنه پاکت خطی ---------- */
  .stage{
    position:fixed;inset:0;z-index:10;background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.4rem;transition:opacity .6s ease,visibility .6s;
  }
  .stage.gone{opacity:0;visibility:hidden}
  .env-wrap{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .env-svg{width:min(72vw,300px);display:block;overflow:visible}
  .env-svg .stroke{
    fill:none;stroke:var(--ink);stroke-width:1.6;
    stroke-dasharray:900;stroke-dashoffset:900;
    animation:draw 1.6s ease forwards;
  }
  .env-svg .flapline{
    fill:none;stroke:var(--ink);stroke-width:1.6;
    stroke-dasharray:500;stroke-dashoffset:500;
    animation:draw 1.2s ease .7s forwards;
    transform-origin:150px 30px;
    transition:transform .8s cubic-bezier(.6,0,.3,1);
  }
  .env-wrap.open .flapline{transform:rotateX(180deg)}
  .env-svg .dot{
    fill:var(--wine);opacity:0;animation:pop .5s ease 1.7s forwards;
    transition:opacity .3s ease;
  }
  .env-wrap.open .dot{opacity:0!important}
  .env-svg .mini-letter{
    fill:var(--paper);stroke:var(--ink);stroke-width:1.4;
    transition:transform .9s cubic-bezier(.22,.9,.3,1) .5s;
  }
  .env-wrap.open .mini-letter{transform:translateY(-88px)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:scale(.4);transform-origin:center}to{opacity:1;transform:scale(1)}}
  .hint{
    font-size:.8rem;font-weight:300;letter-spacing:.25em;color:var(--mute);
    animation:pulse 2.4s ease infinite;
  }
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- کارت اصلی ---------- */
  .invite{
    position:relative;z-index:5;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    padding:2.5rem 1.2rem;opacity:0;visibility:hidden;
    transition:opacity .8s ease .1s,visibility .8s;
  }
  .invite.show{opacity:1;visibility:visible}
  .sheet{
    width:min(92vw,460px);
    background:#fff;
    border:1px solid var(--hair);
    padding:3.2rem 2.2rem 2.2rem;
    position:relative;
  }
  .eyebrow{
    display:flex;align-items:center;justify-content:space-between;
    font-size:.66rem;letter-spacing:.3em;font-weight:300;color:var(--mute);
    padding-bottom:1.6rem;border-bottom:1px solid var(--hair);
  }
  .names{
    text-align:center;margin:2.6rem 0 2.2rem;line-height:1.15;
  }
  .names .n{
    display:block;font-weight:900;
    font-size:clamp(3rem,14vw,4.6rem);
    letter-spacing:-.02em;
  }
  .names .amp{
    display:block;color:var(--wine);
    font-weight:100;font-size:clamp(2rem,9vw,3rem);
    line-height:1.3;
  }
  .tagline{
    text-align:center;font-size:.95rem;font-weight:300;
    letter-spacing:.5em;color:var(--mute);margin-bottom:2.6rem;
  }
  .tagline b{color:var(--wine);font-weight:600}

  .grid{
    display:grid;grid-template-columns:1fr 1fr;
    border-top:1px solid var(--hair);
  }
  .cell{
    padding:1.3rem .4rem 1.3rem 0;border-bottom:1px solid var(--hair);
  }
  .cell:nth-child(odd){border-left:1px solid var(--hair);padding-left:1.2rem}
  .cell:nth-child(even){padding-right:1.2rem}
  .cell.full{grid-column:1/-1;border-left:none;padding-left:0;padding-right:0}
  .lbl{font-size:.62rem;letter-spacing:.3em;color:var(--mute);font-weight:300;margin-bottom:.5rem}
  .val{font-size:1.02rem;font-weight:600}
  .val small{display:block;font-size:.8rem;font-weight:300;color:var(--mute);margin-top:.3rem;line-height:1.9}
  .num{color:var(--wine)}

  .closing{
    margin-top:2rem;text-align:center;
    font-size:.9rem;font-weight:300;color:var(--mute);line-height:2.1;
  }
  .sig{
    margin-top:1.8rem;display:flex;align-items:center;gap:1rem;
    font-size:.66rem;letter-spacing:.3em;color:var(--mute);font-weight:300;
  }
  .sig::before,.sig::after{content:"";flex:1;height:1px;background:var(--hair)}

  .invite.show .rise{animation:rise .7s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*.13s)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .env-svg .stroke,.env-svg .flapline{stroke-dashoffset:0}
    .env-svg .dot{opacity:1}
  }
</style>
</head>
<body>

<!-- صحنه‌ی پاکت خطی -->
<section class="stage" id="stage" aria-label="پاکت دعوت‌نامه">
  <div class="env-wrap" id="envWrap" role="button" tabindex="0" aria-label="باز کردن دعوت‌نامه">
    <svg class="env-svg" viewBox="0 0 300 210" aria-hidden="true">
      <!-- نامه کوچک داخل پاکت -->
      <rect class="mini-letter" x="55" y="45" width="190" height="130"/>
      <!-- بدنه پاکت -->
      <path class="stroke" d="M20 30 H280 V190 H20 Z"/>
      <path class="stroke" d="M20 190 L120 105 M280 190 L180 105"/>
      <!-- درِ پاکت -->
      <path class="flapline" id="flap" d="M20 30 L150 125 L280 30"/>
      <!-- مهر -->
      <circle class="dot" id="dot" cx="150" cy="112" r="10"/>
    </svg>
  </div>
  <p class="hint">برای باز کردن لمس کنید</p>
</section>

<!-- کارت دعوت -->
<main class="invite" id="invite">
  <div class="sheet">

    <div class="eyebrow rise" style="--i:0">
      <span>دعوت‌نامه</span>
      <span>۱۴۰۵</span>
    </div>

    <h1 class="names rise" style="--i:1">
      <span class="n">کیانا</span>
      <span class="amp">و</span>
      <span class="n">علی</span>
    </h1>

    <p class="tagline rise" style="--i:2">جشنِ <b>نامزدی</b></p>

    <div class="grid rise" style="--i:3">
      <div class="cell">
        <p class="lbl">تاریخ</p>
        <p class="val">پنج‌شنبه <span class="num">۱۲ شهریور</span></p>
      </div>
      <div class="cell">
        <p class="lbl">ساعت</p>
        <p class="val"><span class="num">۱۸:۰۰</span></p>
      </div>
      <div class="cell full">
        <p class="lbl">مکان</p>
        <p class="val">مجموعه سانست
          <small>ابتدای دوکوهک، بعد از مجتمع خلیج فارس، کوچه کابل‌سازی، فرعی اول سمت راست</small>
        </p>
      </div>
    </div>

    <p class="closing rise" style="--i:4">حضور شما، بهترین هدیه‌ی این شب برای ماست.</p>

    <p class="sig rise" style="--i:5">کیانا و علی — شهریور ۱۴۰۵</p>
  </div>
</main>

<script>
(function(){
  var stage=document.getElementById('stage'),
      wrap=document.getElementById('envWrap'),
      invite=document.getElementById('invite'),
      reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      opened=false;

  function open(){
    if(opened)return;opened=true;
    if(reduced){stage.classList.add('gone');invite.classList.add('show');return;}
    wrap.classList.add('open');
    setTimeout(function(){stage.classList.add('gone');},1350);
    setTimeout(function(){invite.classList.add('show');},1650);
  }
  wrap.addEventListener('click',open);
  wrap.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}
  });
})();
</script>
</body>
</html>
